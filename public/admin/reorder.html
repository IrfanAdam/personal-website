<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reorder Projects — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/admin/reorder.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Reorder Projects</h1>
        <p>Drag to reorder — order on the masonry is <code>1</code> first, top-left. <a href="/admin/">Back to CMS</a></p>
      </div>
      <div class="actions">
        <span class="status" id="status"></span>
        <button class="btn" id="reset" type="button">Reset</button>
        <button class="btn primary" id="save" type="button" disabled>Save order</button>
      </div>
    </div>
    <ul class="list" id="list" aria-label="Projects"></ul>
    <p class="hint">Saves to <code>content/projects/*.json</code> → <code>order</code>. Works on <code>localhost:5173</code> with <code>npm run cms:dev</code> or <code>npm run dev</code>. Refresh the portfolio to see the new grid order. Edits commit as file writes — push when ready.</p>
  </div>
  <script type="module" src="/admin/reorder.js"></script>
</body>
</html>
